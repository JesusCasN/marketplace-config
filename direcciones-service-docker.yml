server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    # Conexión a PostgreSQL. El host debe ser el nombre del servicio Docker: "postgres"
#    url: ${SPRING_DATASOURCE_URL}
#    username: ${SPRING_DATASOURCE_USERNAME}
#    password: ${SPRING_DATASOURCE_PASSWORD}
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}  # el esquema lo gestiona Flyway (db/migration)
    show-sql: ${SPRING_JPA_SHOW_SQL:true}  # Muestra las consultas SQL en consola
    properties:
      hibernate:
        format_sql: true  # Formatea el SQL para mayor legibilidad
    # database-platform: no se declara a proposito. Hibernate lo deduce de la conexion JDBC,
    # y fijarlo a mano rompe en cada actualizacion: MySQL8Dialect se elimino en Hibernate 6
    # y dejo ordenes y pagos sin arrancar tras migrar a Spring Boot 4.

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Configuración del token JWT
#jwt:
#  secret: ${JWT_SECRET}


