server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  datasource:
#    url: jdbc:mysql://localhost:3308/ordenesdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#    username: root
#    password: Chuchoska387
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # el esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincide
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # database-platform: no se declara a proposito. Hibernate lo deduce de la conexion JDBC,
    # y fijarlo a mano rompe en cada actualizacion: MySQL8Dialect se elimino en Hibernate 6
    # y dejo ordenes y pagos sin arrancar tras migrar a Spring Boot 4.

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          trusted:
            packages: '*'

  consumer-groups:
    pago-confirmado: ordenes-group-v2
    pedido-enviado: pedido-enviado-group-v2
    pedido-entregado: pedido-entregado-group-v2
    pedido-cancelado: pedido-cancelado-group-v2

logging:
  level:
    feign: DEBUG
    com.marketplace.app.ordenes.client: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org:
    springframework:
      kafka: INFO

jwt:
