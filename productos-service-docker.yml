server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
#    url: ${SPRING_DATASOURCE_URL}
#    username: ${SPRING_DATASOURCE_USERNAME}
#    password: ${SPRING_DATASOURCE_PASSWORD}
#    driver-class-name: org.postgresql.Driver

  # OJO: este bloque colgaba de `datasource`, o sea spring.datasource.jpa.*, que Spring
  # ignora en silencio. En el perfil docker no se aplicaba nada de aqui; solo funcionaba
  # porque productos-service.yml, que Config Server fusiona con este, lo tiene bien.
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}  # el esquema lo gestiona Flyway (db/migration)
    show-sql: ${SPRING_JPA_SHOW_SQL:true}  # Muestra las consultas SQL en consola
    properties:
      hibernate:
        format_sql: true  # Formatea el SQL para mayor legibilidad
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Configuración del token JWT
#jwt:
#  secret: ${JWT_SECRET}
