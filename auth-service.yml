server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  datasource:
#    url: jdbc:postgresql://localhost:5433/authdb
#    username: postgres
#    password: Chuchoska387
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # el esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincide
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
#  secret: MiSuperClaveSecretaParaJWT12345678901234567890
  access-token:
    expiration-ms: 10800000 # 3 horas por defecto
  refresh-token:
    expiration-ms: 604800000 # 7 días
