server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
#  datasource:
#    url: jdbc:mysql://localhost:3309/pagosdb
#    username: root
#    password: Chuchoska387
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # database-platform: no se declara a proposito. Hibernate lo deduce de la conexion JDBC,
    # y fijarlo a mano rompe en cada actualizacion: MySQL8Dialect se elimino en Hibernate 6
    # y dejo ordenes y pagos sin arrancar tras migrar a Spring Boot 4.

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ordenes-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          trusted:
            packages: '*'


#jwt:
#  secret: MiSuperClaveSecretaParaJWT12345678901234567890

logging:
  level:
    org:
      springframework:
        kafka: INFO

app:
  kafka:
    topics:
      pago-confirmado: pago-confirmado


