server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/users/**

            - id: productos
              uri: lb://productos-service
              predicates:
                - Path=/api/productos/**

            - id: ordenes
              uri: lb://ordenes-service
              predicates:
                - Path=/api/pedidos/**

            - id: direcciones
              uri: lb://direcciones-service
              predicates:
                - Path=/api/direcciones/**

            - id: pagos
              uri: lb://pagos-service
              predicates:
                - Path=/api/pagos/**

            - id: envios
              uri: lb://envios-service
              predicates:
                - Path=/api/envios/**

          globalcors:
            corsConfigurations:
              "[/**]":
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          httpclient:
            connect-timeout: 10000
            response-timeout: 60s

management:
  endpoint:
    gateway:
      access: read-only
    web:
      exposure:
        include: "*"
